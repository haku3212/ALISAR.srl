<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ALISAR · Sistema Integral de Gestión</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Manrope:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />

  <style>
    :root{
      --bg:#0d1410; --bg-elev:#131c17; --bg-card:#182219; --bg-card-2:#1d281f;
      --border:#28342a; --border-soft:#1f2922;
      --text:#e7ebe5; --text-dim:#9aa39a; --text-mute:#6b7468;
      --primary:#4ade80; --primary-dark:#16a34a; --primary-glow:rgba(74,222,128,.18);
      --accent:#fbbf24; --accent-dark:#d97706;
      --success:#4ade80; --warn:#fbbf24; --danger:#f87171; --info:#60a5fa;
      --radius:14px; --radius-sm:10px;
      --shadow-hard:0 10px 40px rgba(0,0,0,.45);
      --font-display:'Bricolage Grotesque', system-ui, sans-serif;
      --font-body:'Manrope', system-ui, sans-serif;
      --font-mono:'JetBrains Mono', ui-monospace, monospace;
    }
    *{box-sizing:border-box}
    html,body{margin:0;padding:0;height:100%}
    body{font-family:var(--font-body); background:var(--bg); color:var(--text); -webkit-font-smoothing:antialiased; overflow:hidden}
    button{font-family:inherit; cursor:pointer}
    input,select,textarea{font-family:inherit}

    .bg-noise{position:fixed; inset:0; pointer-events:none; z-index:0;
      background-image:
        radial-gradient(1200px 600px at 80% -10%, rgba(74,222,128,.05), transparent 60%),
        radial-gradient(900px 500px at -10% 100%, rgba(251,191,36,.04), transparent 60%);}

    .app{position:relative; z-index:1; display:grid; grid-template-columns:260px 1fr; height:100vh}

    /* Sidebar */
    .sidebar{background:linear-gradient(180deg,#0f1813,#0a110d); border-right:1px solid var(--border); padding:22px 14px; display:flex; flex-direction:column; overflow-y:auto}
    .brand{display:flex; align-items:center; gap:10px; padding:4px 8px 18px; border-bottom:1px solid var(--border-soft); margin-bottom:18px}
    .brand-logo{width:38px; height:38px; background:linear-gradient(135deg,var(--primary),var(--primary-dark)); border-radius:10px; display:grid; place-items:center; box-shadow:0 0 0 1px rgba(74,222,128,.3), 0 6px 20px rgba(74,222,128,.25)}
    .brand-logo i{color:#0a110d; font-size:22px}
    .brand-text{display:flex; flex-direction:column; line-height:1}
    .brand-name{font-family:var(--font-display); font-weight:700; font-size:20px; letter-spacing:-.02em}
    .brand-sub{font-size:10px; color:var(--text-mute); text-transform:uppercase; letter-spacing:.14em; margin-top:4px}
    .nav-label{font-size:10px; color:var(--text-mute); text-transform:uppercase; letter-spacing:.15em; padding:14px 10px 6px}
    .nav-item{display:flex; align-items:center; gap:12px; padding:10px 12px; border-radius:var(--radius-sm); color:var(--text-dim); cursor:pointer; font-weight:500; font-size:14px; transition:all .15s ease; border:1px solid transparent; margin-bottom:2px}
    .nav-item i{font-size:18px}
    .nav-item:hover{background:rgba(255,255,255,.03); color:var(--text)}
    .nav-item.active{background:linear-gradient(135deg, rgba(74,222,128,.12), rgba(74,222,128,.04)); color:var(--primary); border-color:rgba(74,222,128,.18); box-shadow:inset 2px 0 0 var(--primary)}
    .nav-badge{margin-left:auto; font-family:var(--font-mono); font-size:10px; font-weight:600; background:var(--bg-card-2); color:var(--text-dim); padding:2px 7px; border-radius:6px}
    .nav-item.active .nav-badge{background:rgba(74,222,128,.18); color:var(--primary)}
    .nav-badge.alert{background:rgba(248,113,113,.15); color:var(--danger)}
    .sidebar-foot{margin-top:auto; padding:14px 10px; border-top:1px solid var(--border-soft); display:flex; align-items:center; gap:10px}
    .avatar{width:36px; height:36px; border-radius:50%; background:linear-gradient(135deg,var(--accent),var(--accent-dark)); display:grid; place-items:center; font-family:var(--font-display); font-weight:700; color:#1a1208}
    .user-info{display:flex; flex-direction:column; line-height:1.2}
    .user-name{font-size:13px; font-weight:600}
    .user-role{font-size:11px; color:var(--text-mute)}

    .main{overflow-y:auto; padding:26px 32px 60px}
    .topbar{display:flex; align-items:center; justify-content:space-between; margin-bottom:28px}
    .page-title{font-family:var(--font-display); font-size:32px; font-weight:600; letter-spacing:-.02em; line-height:1.1}
    .page-sub{color:var(--text-dim); font-size:13px; margin-top:4px}
    .topbar-actions{display:flex; align-items:center; gap:10px}
    .search-box{display:flex; align-items:center; gap:8px; background:var(--bg-card); border:1px solid var(--border); border-radius:10px; padding:8px 12px; width:280px}
    .search-box i{color:var(--text-mute); font-size:16px}
    .search-box input{background:transparent; border:none; outline:none; color:var(--text); width:100%; font-size:13px}

    .btn{display:inline-flex; align-items:center; gap:8px; padding:9px 14px; font-size:13px; font-weight:600; border-radius:10px; border:1px solid var(--border); background:var(--bg-card); color:var(--text); transition:all .15s ease}
    .btn:hover{background:var(--bg-card-2)}
    .btn-primary{background:linear-gradient(135deg,var(--primary),var(--primary-dark)); color:#0a110d; border-color:transparent; box-shadow:0 4px 16px rgba(74,222,128,.25)}
    .btn-primary:hover{filter:brightness(1.08)}
    .btn-ghost{background:transparent}
    .btn-danger{color:var(--danger); border-color:rgba(248,113,113,.25)}
    .btn-danger:hover{background:rgba(248,113,113,.08)}
    .btn-sm{padding:5px 10px; font-size:12px}
    .btn-icon{padding:8px}

    .kpi-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:22px}
    .kpi{background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); padding:20px; position:relative; overflow:hidden; transition:transform .2s ease, border-color .2s ease}
    .kpi:hover{transform:translateY(-2px); border-color:rgba(74,222,128,.3)}
    .kpi-icon{width:38px; height:38px; border-radius:10px; display:grid; place-items:center; margin-bottom:14px}
    .kpi-icon i{font-size:20px}
    .kpi-label{font-size:11px; text-transform:uppercase; letter-spacing:.12em; color:var(--text-mute); font-weight:600}
    .kpi-value{font-family:var(--font-display); font-size:30px; font-weight:700; letter-spacing:-.02em; line-height:1; margin-top:6px}
    .kpi-value .unit{font-size:14px; color:var(--text-dim); font-weight:500}
    .kpi-trend{display:flex; align-items:center; gap:4px; font-size:12px; margin-top:10px; font-family:var(--font-mono)}
    .trend-up{color:var(--success)} .trend-dn{color:var(--danger)} .trend-flat{color:var(--text-mute)}
    .kpi.green .kpi-icon{background:rgba(74,222,128,.12); color:var(--primary)}
    .kpi.amber .kpi-icon{background:rgba(251,191,36,.12); color:var(--accent)}
    .kpi.blue  .kpi-icon{background:rgba(96,165,250,.12); color:var(--info)}
    .kpi.red   .kpi-icon{background:rgba(248,113,113,.12); color:var(--danger)}

    .grid-2{display:grid; grid-template-columns:1.4fr 1fr; gap:16px; margin-bottom:22px}
    .grid-3{display:grid; grid-template-columns:repeat(3,1fr); gap:16px}
    .card{background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); padding:20px}
    .card-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px}
    .card-title{font-family:var(--font-display); font-size:17px; font-weight:600; letter-spacing:-.01em}
    .card-sub{font-size:12px; color:var(--text-mute)}

    .tbl{width:100%; border-collapse:collapse; font-size:13px}
    .tbl thead th{text-align:left; padding:10px 12px; color:var(--text-mute); font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.08em; border-bottom:1px solid var(--border-soft); background:rgba(255,255,255,.015)}
    .tbl tbody td{padding:12px; border-bottom:1px solid var(--border-soft); vertical-align:middle}
    .tbl tbody tr:hover{background:rgba(255,255,255,.02)}
    .tbl .mono{font-family:var(--font-mono); font-size:12px}
    .tbl .num{font-family:var(--font-mono); text-align:right}

    .pill{display:inline-flex; align-items:center; gap:5px; padding:3px 9px; border-radius:999px; font-size:11px; font-weight:600; border:1px solid; white-space:nowrap}
    .pill .dot{width:6px; height:6px; border-radius:50%; background:currentColor}
    .pill-green{color:var(--success); background:rgba(74,222,128,.08); border-color:rgba(74,222,128,.25)}
    .pill-amber{color:var(--accent); background:rgba(251,191,36,.08); border-color:rgba(251,191,36,.25)}
    .pill-red  {color:var(--danger); background:rgba(248,113,113,.08); border-color:rgba(248,113,113,.25)}
    .pill-blue {color:var(--info);   background:rgba(96,165,250,.08); border-color:rgba(96,165,250,.25)}
    .pill-gray {color:var(--text-dim); background:rgba(255,255,255,.04); border-color:var(--border)}

    .progress{height:6px; background:var(--bg-card-2); border-radius:999px; overflow:hidden; position:relative}
    .progress-bar{height:100%; background:linear-gradient(90deg,var(--primary),#86efac); border-radius:999px; transition:width .4s ease}
    .progress-bar.amber{background:linear-gradient(90deg,var(--accent),#fcd34d)}
    .progress-bar.red{background:linear-gradient(90deg,var(--danger),#fca5a5)}

    .form-row{display:grid; gap:12px; margin-bottom:14px}
    .form-row.cols-2{grid-template-columns:1fr 1fr}
    .form-row.cols-3{grid-template-columns:1fr 1fr 1fr}
    .form-row.cols-4{grid-template-columns:1fr 1fr 1fr 1fr}
    .field{display:flex; flex-direction:column; gap:6px}
    .field label{font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--text-mute); font-weight:600}
    .field input,.field select,.field textarea{background:var(--bg-card-2); border:1px solid var(--border); color:var(--text); padding:9px 12px; border-radius:9px; font-size:13px; outline:none; transition:border-color .15s ease}
    .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-glow)}

    .modal-bg{position:fixed; inset:0; z-index:50; background:rgba(5,10,7,.7); backdrop-filter:blur(6px); display:grid; place-items:center; padding:24px; animation:fadeIn .15s ease}
    .modal{background:var(--bg-elev); border:1px solid var(--border); border-radius:16px; padding:24px; width:100%; max-width:680px; box-shadow:var(--shadow-hard); max-height:90vh; overflow-y:auto; animation:slideUp .2s ease}
    .modal.lg{max-width:880px}
    .modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; padding-bottom:14px; border-bottom:1px solid var(--border-soft)}
    .modal-title{font-family:var(--font-display); font-size:19px; font-weight:600; letter-spacing:-.01em}
    .modal-foot{display:flex; gap:10px; justify-content:flex-end; padding-top:16px; margin-top:16px; border-top:1px solid var(--border-soft)}
    .close-btn{background:transparent; border:1px solid var(--border); color:var(--text-dim); width:32px; height:32px; border-radius:8px; display:grid; place-items:center}
    .close-btn:hover{color:var(--text)}

    @keyframes fadeIn{from{opacity:0}to{opacity:1}}
    @keyframes slideUp{from{opacity:0; transform:translateY(10px)}to{opacity:1; transform:translateY(0)}}
    .page-enter{animation:fadeIn .25s ease}

    .chart-area{width:100%; height:220px}

    ::-webkit-scrollbar{width:8px; height:8px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{background:var(--border); border-radius:4px}
    ::-webkit-scrollbar-thumb:hover{background:#3a4a3d}

    .hstack{display:flex; align-items:center; gap:10px}
    .vstack{display:flex; flex-direction:column; gap:10px}
    .spacer{flex:1}
    .text-mute{color:var(--text-mute)}
    .text-dim{color:var(--text-dim)}
    .text-mono{font-family:var(--font-mono)}
    .text-sm{font-size:12px}
    .text-xs{font-size:11px}
    .strong{font-weight:600}

    .ini{width:32px; height:32px; border-radius:8px; display:grid; place-items:center; font-size:11px; font-weight:700; background:var(--bg-card-2); font-family:var(--font-display)}
    .ini.g{background:rgba(74,222,128,.15); color:var(--primary)}
    .ini.a{background:rgba(251,191,36,.15); color:var(--accent)}
    .ini.b{background:rgba(96,165,250,.15); color:var(--info)}
    .ini.r{background:rgba(248,113,113,.15); color:var(--danger)}
    .ini.p{background:rgba(167,139,250,.15); color:#a78bfa}

    .callout{display:flex; align-items:flex-start; gap:12px; padding:14px 16px; border-radius:12px; border:1px solid; margin-bottom:16px}
    .callout i{font-size:18px; margin-top:1px}
    .callout.amber{background:rgba(251,191,36,.06); border-color:rgba(251,191,36,.2); color:var(--accent)}
    .callout.red{background:rgba(248,113,113,.06); border-color:rgba(248,113,113,.2); color:var(--danger)}
    .callout.green{background:rgba(74,222,128,.06); border-color:rgba(74,222,128,.2); color:var(--success)}
    .callout-body{color:var(--text); flex:1}
    .callout-body strong{display:block; margin-bottom:2px}
    .callout-body p{margin:0; font-size:12px; color:var(--text-dim)}

    .stage{display:inline-flex; align-items:center; gap:5px; padding:3px 8px; border-radius:6px; font-size:11px; font-weight:600; font-family:var(--font-mono); background:var(--bg-card-2); border:1px solid var(--border); white-space:nowrap}

    .empty{padding:50px 24px; text-align:center; color:var(--text-mute)}
    .empty i{font-size:36px; display:block; margin-bottom:8px; opacity:.6}

    .ring-card{position:relative; overflow:hidden}
    .ring-card::before{content:''; position:absolute; width:240px; height:240px; border-radius:50%; right:-100px; top:-100px; background:radial-gradient(circle, rgba(74,222,128,.1), transparent 70%); pointer-events:none}

    .toolbar{display:flex; gap:8px; align-items:center; margin-bottom:14px; flex-wrap:wrap}
    .toolbar input, .toolbar select{background:var(--bg-card); border:1px solid var(--border); color:var(--text); padding:8px 12px; border-radius:8px; font-size:13px; outline:none}
    .toolbar input:focus, .toolbar select:focus{border-color:var(--primary)}

    .tab-bar{display:flex; gap:4px; margin-bottom:18px; border-bottom:1px solid var(--border-soft)}
    .tab{padding:10px 14px; font-size:13px; color:var(--text-dim); cursor:pointer; border-bottom:2px solid transparent; transition:all .15s; font-weight:500}
    .tab:hover{color:var(--text)}
    .tab.active{color:var(--primary); border-color:var(--primary)}

    .stat-mini{display:flex; flex-direction:column; gap:2px}
    .stat-mini .lbl{font-size:10px; color:var(--text-mute); text-transform:uppercase; letter-spacing:.1em; font-weight:600}
    .stat-mini .val{font-family:var(--font-display); font-size:20px; font-weight:700; letter-spacing:-.01em}

    .pipeline{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:18px}
    .pipe-col{background:var(--bg-card); border:1px solid var(--border); border-radius:12px; padding:14px; min-height:120px}
    .pipe-col-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; padding-bottom:10px; border-bottom:1px solid var(--border-soft)}
    .pipe-col-title{font-family:var(--font-display); font-size:14px; font-weight:600}
    .pipe-card{background:var(--bg-card-2); border:1px solid var(--border-soft); border-radius:8px; padding:10px; margin-bottom:8px; font-size:12px}
    .pipe-card .top{display:flex; justify-content:space-between; margin-bottom:4px}
    .pipe-card .esp{font-weight:600}
    .pipe-card .cu{font-family:var(--font-mono); color:var(--primary)}
  </style>
</head>

  <script type="text/babel" data-presets="env,react">

    /* ---------- UTILIDADES ---------- */
    const fmtBs   = (n) => "Bs " + (Number(n)||0).toLocaleString("es-BO", { maximumFractionDigits: 0 });
    const fmtNum  = (n, d=0) => (Number(n)||0).toLocaleString("es-BO", { minimumFractionDigits:d, maximumFractionDigits:d });

    function calcularPlanilla(emp){
      const jornal = emp.salarioBase / 22;
      const horaExtra = (emp.salarioBase / 176) * 2;
      const bruto = emp.salarioBase + (emp.horasExtra * horaExtra) - (emp.diasFalta * jornal);
      const afp = bruto * 0.0471;
      const rcIva = bruto * (emp.rcIva/100);
      const neto = bruto - afp - rcIva;
      return { jornal, horaExtra, bruto, afp, rcIva, neto };
    }

    const Icon = ({n, style}) => <i className={`ti ti-${n}`} style={style}></i>;

    function StatePill({state}){
      const map = {
        "Operativa":        {cls:"pill-green"},
        "Disponible":       {cls:"pill-blue"},
        "En mantenimiento": {cls:"pill-amber"},
        "En curso":         {cls:"pill-green"},
        "Iniciando":        {cls:"pill-blue"},
        "Finalizada":       {cls:"pill-gray"},
        "Activo":           {cls:"pill-green"},
        "En preparación":   {cls:"pill-amber"},
        "Cerrado":          {cls:"pill-gray"},
        "Fijo":             {cls:"pill-green"},
        "Eventual":         {cls:"pill-amber"}
      };
      const m = map[state] || {cls:"pill-gray"};
      return <span className={`pill ${m.cls}`}><span className="dot"></span>{state}</span>;
    }

    function StagePill({stage}){
      const map = {
        "Tumbado":     {bg:"rgba(248,113,113,.12)", c:"#f87171"},
        "Jalado":      {bg:"rgba(251,191,36,.12)",  c:"#fbbf24"},
        "Cargado":     {bg:"rgba(96,165,250,.12)",  c:"#60a5fa"},
        "Transportado":{bg:"rgba(74,222,128,.12)",  c:"#4ade80"}

      return <span className="stage" style={{background:m.bg, color:m.c, borderColor:m.bg}}>{stage}</span>;

    function Sidebar({view, setView, alertCount}){

    function Topbar({title, subtitle, actions}){

        <div className="topbar">

          </div>

    function Kpi({icon, label, value, unit, trend, color="green"}){
      return (
        <div className={`kpi ${color}`}>
          <div className="kpi-icon"><Icon n={icon}/></div>
          <div className="kpi-label">{label}</div>
          <div className="kpi-value">{value}{unit && <span className="unit"> {unit}</span>}</div>
          {trend && (
            <div className={`kpi-trend ${trend.dir==="up"?"trend-up":trend.dir==="dn"?"trend-dn":"trend-flat"}`}>
              <Icon n={trend.dir==="up"?"trending-up":trend.dir==="dn"?"trending-down":"minus"}/>
              <span>{trend.text}</span>
            </div>
          )}
        </div>
      );
    }

    function BarChart({data, valueKey="value", labelKey="label", color="var(--primary)"}){
      const W=600, H=200, pad={l:30,r:10,t:10,b:30};
      const iW=W-pad.l-pad.r, iH=H-pad.t-pad.b;
      const max=Math.max(...data.map(d=>d[valueKey]),1);
      const bw=iW/data.length;
      return (
        <svg viewBox={`0 0 ${W} ${H}`} className="chart-area" preserveAspectRatio="xMidYMid meet">
          {[0,.25,.5,.75,1].map(p=>(
            <line key={p} x1={pad.l} x2={W-pad.r} y1={pad.t+iH*(1-p)} y2={pad.t+iH*(1-p)} stroke="#28342a" strokeDasharray="2 4"/>
          ))}
          {data.map((d,i)=>{
            const h=(d[valueKey]/max)*iH, x=pad.l+i*bw+bw*0.18, y=pad.t+iH-h;
            return (
              <g key={i}>
                <rect x={x} y={y} width={bw*0.64} height={h} fill={color} opacity="0.85" rx="4"/>
                <text x={x+bw*0.32} y={H-10} textAnchor="middle" fontSize="10" fill="var(--text-mute)" fontFamily="var(--font-mono)">{d[labelKey]}</text>
                <text x={x+bw*0.32} y={y-4} textAnchor="middle" fontSize="10" fill="var(--text)" fontFamily="var(--font-mono)" fontWeight="600">{d[valueKey]}</text>
              </g>
            );
          })}
        </svg>
      );
    }

    function DonutChart({data, size=170}){
      const total=data.reduce((s,d)=>s+d.value,0)||1;
      const r=size/2-14, cx=size/2, cy=size/2;
      let acc=0;
      const arcs=data.map((d,i)=>{
        const s=acc/total*Math.PI*2; acc+=d.value; const e=acc/total*Math.PI*2;
        const large=(e-s)>Math.PI?1:0;
        return {
          path:`M ${cx+r*Math.cos(s-Math.PI/2)} ${cy+r*Math.sin(s-Math.PI/2)} A ${r} ${r} 0 ${large} 1 ${cx+r*Math.cos(e-Math.PI/2)} ${cy+r*Math.sin(e-Math.PI/2)}`,
          color:d.color, label:d.label, value:d.value
        };
      });
      return (
        <div style={{display:"flex",alignItems:"center",gap:18}}>
          <svg width={size} height={size}>
            <circle cx={cx} cy={cy} r={r} fill="none" stroke="#28342a" strokeWidth="14"/>
            {arcs.map((a,i)=><path key={i} d={a.path} fill="none" stroke={a.color} strokeWidth="14" strokeLinecap="round"/>)}
            <text x={cx} y={cy-2} textAnchor="middle" fontFamily="var(--font-display)" fontSize="22" fontWeight="700" fill="var(--text)">{total}</text>
            <text x={cx} y={cy+16} textAnchor="middle" fontSize="10" fill="var(--text-mute)" letterSpacing="2">TOTAL</text>
          </svg>
          <div style={{display:"flex",flexDirection:"column",gap:8,flex:1}}>
            {arcs.map((a,i)=>(
              <div key={i} style={{display:"flex",alignItems:"center",gap:8,fontSize:12}}>
                <span style={{width:10,height:10,background:a.color,borderRadius:3}}></span>
                <span style={{flex:1,color:"var(--text-dim)"}}>{a.label}</span>
                <span style={{fontFamily:"var(--font-mono)",fontWeight:600}}>{a.value}</span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function Modal({title, onClose, children, footer, size}){
      return (
        <div className="modal-bg" onClick={e=>{if(e.target===e.currentTarget)onClose()}}>

    /* ============================================================ DASHBOARD */
    function PageDashboard({obras,maquinas,empleados,rodeos,campamentos,documentos,setView}){

          </div>
          <div className="grid-2">

              <div className="card-head"><div><div className="card-title">Presupuesto vs Ejecucion</div><div className="card-sub">Obras activas - 2026</div></div><span className="pill pill-green"><span className="dot"></span>En linea</span></div>
              <div style={{display:"flex",gap:24,marginTop:6,flexWrap:"wrap"}}>
                <div><div className="text-xs text-mute" style={{letterSpacing:".1em",textTransform:"uppercase"}}>Presupuesto</div><div style={{fontFamily:"var(--font-display)",fontSize:24,fontWeight:700,marginTop:4}}>{fmtBs(totPres)}</div></div>
                <div><div className="text-xs text-mute" style={{letterSpacing:".1em",textTransform:"uppercase"}}>Ejecutado</div><div style={{fontFamily:"var(--font-display)",fontSize:24,fontWeight:700,marginTop:4,color:"var(--accent)"}}>{fmtBs(totGast)}</div></div>
                <div><div className="text-xs text-mute" style={{letterSpacing:".1em",textTransform:"uppercase"}}>Ejecucion</div><div style={{fontFamily:"var(--font-display)",fontSize:24,fontWeight:700,marginTop:4,color:"var(--primary)"}}>{Math.round(totGast/totPres*100)}%</div></div>
              </div>
              <div style={{marginTop:18}}>
                {obras.filter(o=>o.estado!=="Finalizada").map(o=>{
                  const e=(o.gastado/o.presupuesto*100);
                  return (<div key={o.id} style={{marginBottom:14}}>
                    <div style={{display:"flex",justifyContent:"space-between",marginBottom:5,fontSize:12,gap:8}}>
                      <span className="strong" style={{flex:1,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{o.nombre}</span>

              <tbody>
                {filtered.map((e,i)=>{const p=calcularPlanilla(e);return(
                  <tr key={e.id}>
                    <td><div className="hstack"><div className={`ini ${colorByIdx(i)}`}>{initials(e.nombres+" "+e.apellidos)}</div><div><div className="strong">{e.nombres} {e.apellidos}</div><div className="text-xs text-mute mono">CI {e.ci}</div></div></div></td>
                    <td className="text-sm">{e.cargo}</td>
                    <td><StatePill state={e.contrato}/></td>
                    <td className="text-sm text-dim">{cN(e.campamentoId)}</td>

                    <td className="num text-mute">{e.horasExtra}h</td>

                    <td className="num strong" style={{color:"var(--primary)"}}>{fmtBs(p.neto)}</td>
                    <td><div className="hstack" style={{gap:4}}><button className="btn btn-sm btn-icon btn-ghost" onClick={()=>setEditing(e)}><Icon n="edit"/></button><button className="btn btn-sm btn-icon btn-ghost btn-danger" onClick={()=>delE(e.id)}><Icon n="trash"/></button></div></td>
                  </tr>

                {filtered.length===0&&<tr><td colSpan="9"><div className="empty"><Icon n="search-off"/>Sin resultados</div></td></tr>}
              </tbody>
              <tfoot><tr style={{background:"rgba(74,222,128,.04)"}}><td colSpan="6" className="strong" style={{padding:"14px 12px"}}>TOTALES</td><td className="num strong">{fmtBs(totales.bruto)}</td><td className="num strong" style={{color:"var(--primary)"}}>{fmtBs(totales.neto)}</td><td></td></tr></tfoot>
            </table>
          </div>
          {editing&&<EmpModal emp={editing} onClose={()=>setEditing(null)} onSave={saveE} campamentos={campamentos}/>}

    function PageRodeos({rodeos,setRodeos,obras,maquinas}){
      const [editing,setEditing]=useState(null);
      const [tab,setTab]=useState("pipeline");
      const empty={id:0,fecha:"2026-05-14",obraId:obras.filter(o=>o.tipo==="Forestal")[0]?.id||null,especie:"Mara",cubos:0,etapa:"Tumbado",origen:"",destino:"",responsable:"",maquinaId:null};
      const m3=rodeos.reduce((s,r)=>s+r.cubos,0);
      const etapas=["Tumbado","Jalado","Cargado","Transportado"];
      function saveR(r){if(r.id===0){const nid=Math.max(...rodeos.map(x=>x.id),0)+1;setRodeos([...rodeos,{...r,id:nid}]);}else{setRodeos(rodeos.map(x=>x.id===r.id?r:x));}setEditing(null);}
      function delR(id){if(confirm("Eliminar?"))setRodeos(rodeos.filter(r=>r.id!==id));}
      function moveR(r,d){const or=["Tumbado","Jalado","Cargado","Transportado"];const i=or.indexOf(r.etapa);const ni=Math.max(0,Math.min(3,i+d));setRodeos(rodeos.map(x=>x.id===r.id?{...x,etapa:or[ni]}:x));}
      const oN=(id)=>obras.find(o=>o.id===id)?.nombre||"—";
      const porEsp=useMemo(()=>{const a={};rodeos.forEach(r=>a[r.especie]=(a[r.especie]||0)+r.cubos);return Object.entries(a).sort((a,b)=>b[1]-a[1]);},[rodeos]);
      return (
        <div className="page-enter">
          <Topbar title="Rodeos - Madera" subtitle={`${rodeos.length} registros - ${fmtNum(m3,1)} m3 procesados`}
            actions={<button className="btn btn-primary" onClick={()=>setEditing(empty)}><Icon n="plus"/> Nuevo Rodeo</button>}/>
          <div className="kpi-grid">
            {etapas.map((et,i)=>{
              const cnt=rodeos.filter(r=>r.etapa===et).length;
              const cub=rodeos.filter(r=>r.etapa===et).reduce((s,r)=>s+r.cubos,0);
              return <div key={et} className={`kpi ${["red","amber","blue","green"][i]}`}>
                <div className="kpi-icon"><Icon n={["axe","arrow-bear-right","package","truck-delivery"][i]}/></div>
                <div className="kpi-label">{et}</div>
                <div className="kpi-value">{cnt} <span className="unit">rodeos</span></div>
                <div className="kpi-trend trend-flat"><Icon n="ruler-2"/><span>{fmtNum(cub,1)} m3</span></div>
              </div>;
            })}
          </div>
          <div className="tab-bar">
            <div className={`tab${tab==="pipeline"?" active":""}`} onClick={()=>setTab("pipeline")}>Pipeline</div>
            <div className={`tab${tab==="tabla"?" active":""}`} onClick={()=>setTab("tabla")}>Tabla detallada</div>
            <div className={`tab${tab==="especies"?" active":""}`} onClick={()=>setTab("especies")}>Por especie</div>
          </div>
          {tab==="pipeline"&&(
            <div className="pipeline">
              {etapas.map(et=>(
                <div key={et} className="pipe-col">
                  <div className="pipe-col-head"><div className="pipe-col-title"><StagePill stage={et}/></div><span className="text-xs text-mute mono">{rodeos.filter(r=>r.etapa===et).length}</span></div>
                  {rodeos.filter(r=>r.etapa===et).map(r=>(
                    <div key={r.id} className="pipe-card">
                      <div className="top"><span className="esp">{r.especie}</span><span className="cu">{fmtNum(r.cubos,1)} m3</span></div>
                      <div className="text-xs text-mute" style={{marginBottom:4}}>{r.fecha} - {r.responsable}</div>
                      <div style={{display:"flex",gap:4,justifyContent:"flex-end",marginTop:6}}>
                        <button className="btn btn-sm btn-icon btn-ghost" onClick={()=>moveR(r,-1)} title="Etapa anterior"><Icon n="arrow-left"/></button>
                        <button className="btn btn-sm btn-icon btn-ghost" onClick={()=>setEditing(r)}><Icon n="edit"/></button>
                        <button className="btn btn-sm btn-icon btn-ghost" onClick={()=>moveR(r,1)} title="Siguiente etapa"><Icon n="arrow-right"/></button>
                      </div>
                    </div>
                  ))}
                  {rodeos.filter(r=>r.etapa===et).length===0&&<div className="text-xs text-mute" style={{textAlign:"center",padding:20}}>Sin rodeos</div>}
                </div>
              ))}
            </div>
          )}
          {tab==="tabla"&&(
            <div className="card"><table className="tbl">
              <thead><tr><th>Fecha</th><th>Especie</th><th>Cubos</th><th>Origen</th><th>Destino</th><th>Responsable</th><th>Etapa</th><th></th></tr></thead>
              <tbody>
                {rodeos.slice().reverse().map(r=>(
                  <tr key={r.id}>
                    <td className="mono">{r.fecha}</td><td className="strong">{r.especie}</td>
                    <td className="num strong">{fmtNum(r.cubos,1)} m3</td>
                    <td className="text-sm text-dim">{r.origen}</td><td className="text-sm text-dim">{r.destino}</td>
                    <td className="text-sm">{r.responsable}</td><td><StagePill stage={r.etapa}/></td>
                    <td><div className="hstack" style={{gap:4}}><button className="btn btn-sm btn-icon btn-ghost" onClick={()=>setEditing(r)}><Icon n="edit"/></button><button className="btn btn-sm btn-icon btn-ghost btn-danger" onClick={()=>delR(r.id)}><Icon n="trash"/></button></div></td>
                  </tr>
                ))}
              </tbody>
            </table></div>
          )}
          {tab==="especies"&&(
            <div className="card">
              <div className="card-head"><div className="card-title">Cubos por Especie</div><span className="text-xs text-mute">{porEsp.length} especies</span></div>
              {porEsp.map(([esp,c])=>(
                <div key={esp} style={{marginBottom:14}}>
                  <div style={{display:"flex",justifyContent:"space-between",fontSize:13,marginBottom:5}}><span className="strong">{esp}</span><span className="text-mono">{fmtNum(c,1)} m3</span></div>
                  <div className="progress"><div className="progress-bar" style={{width:(c/m3*100)+"%"}}></div></div>
                </div>
              ))}
            </div>
          )}
          {editing&&<RodeoModal r={editing} onClose={()=>setEditing(null)} onSave={saveR} obras={obras} maquinas={maquinas}/>}
        </div>
      );
    }

      );

                  <div className="hstack" style={{gap:6}}>
                    <button className="btn btn-sm" style={{flex:1}} onClick={()=>setEditing(c)}><Icon n="edit"/> Editar</button>

          <div className="form-row cols-2">
            <div className="field"><label>Emision</label><input type="date" value={f.fechaEmision} onChange={e=>u("fechaEmision",e.target.value)}/></div>
            <div className="field"><label>Vencimiento</label><input type="date" value={f.fechaVenc} onChange={e=>u("fechaVenc",e.target.value)}/></div>
          </div>
          <div className="form-row"><div className="field"><label>Observaciones</label><textarea rows="3" value={f.observ} onChange={e=>u("observ",e.target.value)}/></div></div>
        </Modal>
      );
    }

    function PageDocumentos({documentos,setDocumentos,obras,maquinas,empleados}){
      const [editing,setEditing]=useState(null);
      const [fTipo,setFTipo]=useState("Todos");
      const [fEst,setFEst]=useState("Todos");
      const tipos=["Todos",...Array.from(new Set(documentos.map(d=>d.tipo)))];
      const empty={id:0,tipo:"POAT",nombre:"",entidad:"",refTipo:"empresa",refId:null,fechaEmision:"2026-01-01",fechaVenc:"2026-12-31",observ:""};
      const enriched=documentos.map(d=>{const dias=diasHasta(d.fechaVenc);const estado=dias<0?"Vencido":dias<=30?"Por vencer":dias<=90?"Proximo":"Vigente";return{...d,dias,estado};});
      const filtered=enriched.filter(d=>(fTipo==="Todos"||d.tipo===fTipo)&&(fEst==="Todos"||d.estado===fEst)).sort((a,b)=>a.dias-b.dias);
      function saveD(d){if(d.id===0){const nid=Math.max(...documentos.map(x=>x.id),0)+1;setDocumentos([...documentos,{...d,id:nid}]);}else{setDocumentos(documentos.map(x=>x.id===d.id?d:x));}setEditing(null);}
      function delD(id){if(confirm("Eliminar documento?"))setDocumentos(documentos.filter(d=>d.id!==id));}
      function refN(d){if(d.refTipo==="obra")return obras.find(o=>o.id===d.refId)?.nombre||"—";if(d.refTipo==="maquina")return maquinas.find(m=>m.id===d.refId)?.nombre||"—";if(d.refTipo==="empleado"){const e=empleados.find(x=>x.id===d.refId);return e?`${e.nombres} ${e.apellidos}`:"—";}return"Empresa";}
      const nVenc=enriched.filter(d=>d.estado==="Vencido").length;
      const nPorV=enriched.filter(d=>d.estado==="Por vencer").length;
      return (
        <div className="page-enter">
          <Topbar title="Documentos y Vencimientos" subtitle={`${documentos.length} documentos - alertas activas`}
            actions={<button className="btn btn-primary" onClick={()=>setEditing(empty)}><Icon n="plus"/> Nuevo Documento</button>}/>
          {nVenc>0&&<div className="callout red"><Icon n="alert-octagon"/><div className="callout-body"><strong>{nVenc} documento{nVenc>1?"s":""} vencido{nVenc>1?"s":""}</strong><p>Urgente renovar para mantener la operacion al dia.</p></div></div>}
          <div className="kpi-grid">
            <Kpi icon="file-text" label="Total" value={documentos.length} color="green"/>
            <Kpi icon="check-circle" label="Vigentes" value={enriched.filter(d=>d.estado==="Vigente").length} color="green"/>
            <Kpi icon="clock" label="Por vencer 30d" value={nPorV} color="amber"/>
            <Kpi icon="alert-octagon" label="Vencidos" value={nVenc} color="red"/>
          </div>
          <div className="card">
            <div className="toolbar">
              <select value={fTipo} onChange={e=>setFTipo(e.target.value)}>{tipos.map(t=><option key={t}>{t}</option>)}</select>
              <select value={fEst} onChange={e=>setFEst(e.target.value)}><option>Todos</option><option>Vigente</option><option>Proximo</option><option>Por vencer</option><option>Vencido</option></select>
              <span className="text-xs text-mute" style={{marginLeft:"auto"}}>{filtered.length} resultado(s)</span>
            </div>
            <table className="tbl">
              <thead><tr><th>Documento</th><th>Tipo</th><th>Entidad</th><th>Referente</th><th>Emision</th><th>Vencimiento</th><th>Estado</th><th></th></tr></thead>
              <tbody>
                {filtered.map(d=>(
                  <tr key={d.id}>
                    <td><div className="hstack"><div className={`ini ${d.estado==="Vencido"?"r":d.estado==="Por vencer"?"a":d.estado==="Proximo"?"b":"g"}`}><Icon n="file-text"/></div><div><div className="strong">{d.nombre}</div>{d.observ&&<div className="text-xs text-mute" style={{fontStyle:"italic"}}>{d.observ}</div>}</div></div></td>
                    <td><span className="pill pill-gray">{d.tipo}</span></td>
                    <td className="text-sm">{d.entidad}</td>
                    <td className="text-sm text-dim">{refN(d)}</td>
                    <td className="mono text-sm">{d.fechaEmision}</td>
                    <td className="mono text-sm">{d.fechaVenc}</td>
                    <td><span className={`pill ${d.estado==="Vencido"?"pill-red":d.estado==="Por vencer"?"pill-amber":d.estado==="Proximo"?"pill-blue":"pill-green"}`}>{d.dias<0?`Vencido ${-d.dias}d`:`${d.dias}d`}</span></td>
                    <td><div className="hstack" style={{gap:4}}><button className="btn btn-sm btn-icon btn-ghost" onClick={()=>setEditing(d)}><Icon n="edit"/></button><button className="btn btn-sm btn-icon btn-ghost btn-danger" onClick={()=>delD(d.id)}><Icon n="trash"/></button></div></td>
                  </tr>
                ))}
                {filtered.length===0&&<tr><td colSpan="8"><div className="empty"><Icon n="file-off"/>Sin documentos en este filtro</div></td></tr>}
              </tbody>
            </table>
          </div>
          {editing&&<DocModal d={editing} onClose={()=>setEditing(null)} onSave={saveD} obras={obras} maquinas={maquinas} empleados={empleados}/>}
        </div>
      );
    }

    /* ============================================================ APP ROOT */
    function App(){
      const [view,setView]=useState("dashboard");
      const [obras,setObras]=useState(OBRAS_INIT);
      const [maquinas,setMaquinas]=useState(MAQ_INIT);
      const [empleados,setEmpleados]=useState(EMP_INIT);
      const [campamentos,setCampamentos]=useState(CAMP_INIT);
      const [rodeos,setRodeos]=useState(RODEOS_INIT);
      const [documentos,setDocumentos]=useState(DOCS_INIT);
      const alertCount=documentos.filter(d=>diasHasta(d.fechaVenc)<30).length;
      return (
        <div className="app">
          <Sidebar view={view} setView={setView} alertCount={alertCount}/>
          <main className="main">
            {view==="dashboard"   &&<PageDashboard   obras={obras} maquinas={maquinas} empleados={empleados} rodeos={rodeos} campamentos={campamentos} documentos={documentos} setView={setView}/>}
            {view==="obras"       &&<PageObras       obras={obras} setObras={setObras}/>}
            {view==="maquinaria"  &&<PageMaquinaria  maquinas={maquinas} setMaquinas={setMaquinas} obras={obras}/>}
            {view==="rrhh"        &&<PageRRHH        empleados={empleados} setEmpleados={setEmpleados} campamentos={campamentos}/>}
            {view==="rodeos"      &&<PageRodeos      rodeos={rodeos} setRodeos={setRodeos} obras={obras} maquinas={maquinas}/>}
            {view==="campamentos" &&<PageCampamentos campamentos={campamentos} setCampamentos={setCampamentos} obras={obras} empleados={empleados}/>}
            {view==="documentos"  &&<PageDocumentos  documentos={documentos} setDocumentos={setDocumentos} obras={obras} maquinas={maquinas} empleados={empleados}/>}
          </main>
        </div>
      );
    }

    const root=ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App/>);
  </script>
</body>
</html>
